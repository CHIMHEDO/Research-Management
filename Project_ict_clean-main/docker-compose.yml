version: '3.8'

services:
  # 1. Database: MySQL 8.0 (Primary Database for Workload & Research System)
  mysql:
    image: mysql:8.0
    container_name: workload_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: workload_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. File Storage: MinIO (Research Papers Object Storage)
  minio:
    image: minio/minio
    container_name: workload_minio
    environment:
      MINIO_ROOT_USER: admin_minio
      MINIO_ROOT_PASSWORD: minio_password123
    ports:
      - "9000:9000"   # S3 API Port
      - "9001:9001"   # Web UI Console Port
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # 3. PDF Parser: GROBID
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: workload_grobid
    ports:
      - "8070:8070"
    restart: unless-stopped

volumes:
  mysql_data:
    name: workload_mysql_data
  minio_data:
    name: workload_minio_data
